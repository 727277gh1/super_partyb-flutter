name: spb_desktop
description: Super PartyB 桌面端（Linux / Windows / macOS）
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # ---- 本工作区内部包（分层顺序即依赖方向，禁止反向依赖）----
  spb_core:
  spb_models:
  spb_api:
  spb_domain:
  spb_data:
  spb_design:
  spb_ui:
  spb_platform:
  spb_features:

  # ---- 状态管理 ----
  flutter_riverpod: ^3.0.0

  # ---- 路由 ----
  go_router: ^16.0.0

  # ---- 桌面平台能力 ----
  window_manager: ^0.5.0      # 多窗口、窗口尺寸/位置
  tray_manager: ^0.5.0        # 系统托盘
  hotkey_manager: ^0.2.3      # 全局快捷键（Alt+Space 悬浮输入窗）
  screen_retriever: ^0.2.0    # 多显示器定位
  launch_at_startup: ^0.4.0   # 开机自启
  file_selector: ^1.0.3       # 本地目录选择（交付物同步）
  path_provider: ^2.1.4
  path: ^1.9.0

  # ---- 凭证安全存储（Keychain / libsecret / DPAPI）----
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
