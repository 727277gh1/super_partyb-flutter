name: spb_api
description: HTTP 与 SSE 传输层（dio + 手写 SSE 解析），不含业务逻辑
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  spb_core:
  spb_models:
  dio: ^5.7.0
  http_parser: ^4.0.2
  meta: ^1.16.0
  # PKCE 的 S256 challenge = BASE64URL(SHA256(code_verifier))。
  # 用 `package:crypto` 而非自己拼 SHA256：手写实现错了不会报错，
  # 只会在真实登录时得到 invalid_grant（极难定位）。
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  http_mock_adapter: ^0.6.1
