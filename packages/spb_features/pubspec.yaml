name: spb_features
description: 功能模块：chat / works / settings / sync
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  spb_core:
  spb_models:
  spb_api:
  spb_domain:
  spb_design:
  spb_ui:
  spb_platform:

  # ⚠️ 曾声明 flutter_riverpod / go_router / spb_data，但本包 lib **与 test 均未
  # import**：
  # - `flutter_riverpod` / `go_router`：状态管理与路由是**装配层**的职责，
  #   本包只拿注入进来的回调与数据（`ConversationPage` 的 40+ 个具名参数
  #   就是这个取向）；
  # - `spb_data`：本包只用**契约**类型（`GroupCacheStore` / `OutboxEntry` /
  #   `TimelineCacheStore` 均定义在 `spb_domain`），具体 drift 实现由 app 注入。
  # 已删（issue #36）。
  # Agent 回复的 Markdown 渲染。
  #
  # WHY 选它而不是 flutter_markdown_plus：本客户端的主战场是**流式**回复，
  # 归约层已维护 (完整文本, isStreaming) 这一对状态，与本包 API 同构。
  # 它的 settled 前缀缓存使每帧只重建变化中的尾部（官方实测 7.7kB 回复：
  # 全量重建 ~14ms vs 尾部重建 ~1.3ms，且不随回复变长而增长），并能正确处理
  # 未闭合的 `**` / 代码围栏（flutter_markdown_plus 每次全量重解析会闪烁/误渲染）。
  # 另：原官方包 flutter_markdown 已于 2025-05 停止维护。
  gpt_markdown: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试用：构造真实 ChatApi（依赖 dio 类型）并 mock HTTP 响应。
  # 必须显式声明，否则 analyzer 报 depend_on_referenced_packages。
  dio: ^5.7.0
  http_mock_adapter: ^0.6.1
  # 测试用：构造带磁盘路径的 DroppedFile（只有 XFile 才有 path）。
  # 必须显式声明，否则 analyzer 报 depend_on_referenced_packages。
  cross_file: ^0.3.5+5
