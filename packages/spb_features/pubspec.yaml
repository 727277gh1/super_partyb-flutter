name: spb_features
description: 功能模块：chat / works / settings / sync
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  spb_core:
  spb_models:
  spb_api:
  spb_domain:
  spb_data:
  spb_design:
  spb_ui:
  spb_platform:
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试用：构造真实 ChatApi（依赖 dio 类型）并 mock HTTP 响应。
  # 必须显式声明，否则 analyzer 报 depend_on_referenced_packages。
  dio: ^5.7.0
  http_mock_adapter: ^0.6.1
  # 测试用：构造带磁盘路径的 DroppedFile（只有 XFile 才有 path）。
  # 必须显式声明，否则 analyzer 报 depend_on_referenced_packages。
  cross_file: ^0.3.5+5
