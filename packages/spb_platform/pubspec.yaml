name: spb_platform
description: 平台能力抽象：多窗口、托盘、快捷键、文件选择、通知
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  spb_core:
  # FileSink 契约（spb_domain 的 FileSink）——依赖方向 platform → domain
  # 是允许的（见 AGENTS.md 的依赖图）；反向（domain → platform）被分层检查禁止。
  spb_domain:
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.0
  launch_at_startup: ^0.4.0
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  desktop_drop: ^0.8.4
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
