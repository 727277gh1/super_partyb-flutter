name: spb_platform
description: 平台能力抽象：多窗口、托盘、快捷键、文件选择、通知
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  spb_core:
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.0
  launch_at_startup: ^0.4.0
  file_selector: ^1.0.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
